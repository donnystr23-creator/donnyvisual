<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donny Satriadi - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loader-screen" id="landingLoader">
        <div class="loader-container">
            <p class="loader-title">LOADING SYSTEM...</p>
            <div class="loader-bar-wrapper">
                <div class="loader-bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="bg-grid-pattern" aria-hidden="true"></div>
    <section class="landing-section">
        <div class="crt-overlay" aria-hidden="true"></div>

        <div class="landing-container">
            <div class="system-tag">/// SYSTEM READY: V.2026 ///</div>
            <h1 class="landing-title">DONNY SATRIADI</h1>
            <p class="landing-subtitle">SELECT EXPERIENCE</p>
            
            <div class="experience-buttons">
                <a href="mobile.html" class="btn btn-mobile">
                    <span>MOBILE</span>
                    <small>HANDHELD VIEW</small>
                </a>
                <a href="pc.html" class="btn btn-desktop">
                    <span>DESKTOP</span>
                    <small>EXPANDED VIEW</small>
                </a>
            </div>

            <div class="retro-barcode" aria-hidden="true"></div>
        </div>
    </section>

    <script src="style.js"></script>
</body>
</html>
